<!DOCTYPE html>
<html lang="kk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жұқа линза · №11 зертхана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: the lab bench is the home screen (sidebar + banner + stage + reference card, as on the client's mock-up);
   the worksheet from the .docx follows underneath, one calm column of numbered sections. */
:root{
 --bg:#eef1fb;--bg2:#e6ebfa;--card:#ffffff;--glass:rgba(255,255,255,.72);--ink:#1b2a5e;--ink2:#35457c;--muted:#5f6c98;--line:#dbe2f6;
 --hot:#dc4a35;--hot-soft:#fde8e3;--cold:#2f6fdc;--cold-soft:#e2ecfd;--mix:#7a5bd6;--mix-soft:#ece6fb;--exp:#0f8f63;--exp-soft:#daf3e8;--warn:#b86e08;--warn-soft:#fcefd6;
 --accent:#2f6fdc;--accent2:#5a9bf5;--onaccent:#ffffff;--gold:#f0bd4f;
 --side1:#eef2fd;--side2:#dfe6fa;--peach:#fdf0e3;
 --shadow:0 1px 2px rgba(40,60,130,.05),0 10px 28px rgba(60,84,170,.09);--stage:#f6f8ff;--radius:22px;
 --serif:"Noto Serif",Georgia,"Times New Roman",serif;--sans:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
[data-theme="dark"]{color-scheme:dark;
 --bg:#0f1430;--bg2:#1a2147;--card:#171e40;--glass:rgba(26,33,71,.78);--ink:#e8edff;--ink2:#c8d2f4;--muted:#98a5d3;--line:#2c366a;
 --hot:#ff7a62;--hot-soft:#3c1f24;--cold:#7fb0ff;--cold-soft:#1c2c5c;--mix:#b7a2ff;--mix-soft:#2a2358;--exp:#3fd29a;--exp-soft:#113629;--warn:#f2b050;--warn-soft:#3a2a12;
 --accent:#7fb0ff;--accent2:#4f86e6;--onaccent:#0c1230;--gold:#f0c566;
 --side1:#141a3a;--side2:#101530;--peach:#2a2340;
 --shadow:0 10px 30px rgba(0,0,0,.35);--stage:#121836}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
h1,h2,.sb-logo b{font-family:var(--serif)}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 .9rem var(--sans)}
textarea{min-height:92px;resize:vertical}
select{width:auto;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font:600 .92rem var(--sans);cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.solid{background:var(--accent);color:var(--onaccent)}.btn.soft{background:var(--bg2);color:var(--ink)}.btn.small{padding:7px 12px;font-size:.84rem;border-radius:10px}
.chkbtn{background:var(--accent);color:var(--onaccent);padding:9px 24px}
.callout{border-radius:12px;background:var(--cold-soft);padding:10px 12px;font-size:.9rem;margin:10px 0}
.callout.warning{background:var(--warn-soft)}
.callout.tq{background:var(--mix-soft)}
/* app shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:12px;padding:20px 14px 14px;background:linear-gradient(170deg,var(--side1),var(--side2));border-right:1px solid var(--line);overflow:hidden}
.sb-logo{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:0 10px;text-decoration:none;color:var(--ink)}
.sb-logo svg{width:66px;height:66px}
.sb-logo b{font-size:1.5rem;line-height:1.1;font-weight:700}
.sb-main{display:flex;flex-direction:column;gap:4px}
.sb-main a,.sb-main button{display:flex;align-items:center;gap:12px;padding:8px 10px;border:0;border-radius:16px;background:none;color:var(--ink);text-decoration:none;font:600 .92rem var(--serif);line-height:1.2;text-align:left;cursor:pointer;width:100%}
.sb-main a:hover,.sb-main button:hover{background:var(--glass)}
.sb-main a.on{background:color-mix(in srgb,var(--accent) 17%,var(--card));box-shadow:0 6px 16px rgba(60,100,200,.12)}
.sb-main i{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--glass);color:var(--accent)}
.sb-lab{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 12px 0}
.sb-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;font-size:.82rem;padding-right:2px}
.sb-list a{display:flex;gap:9px;align-items:center;color:var(--ink2);text-decoration:none;padding:5px 10px;border-radius:9px;line-height:1.25}
.sb-list a:hover{background:var(--glass)}
.sb-list a b{flex:none;display:inline-grid;place-items:center;min-width:21px;height:21px;border-radius:7px;background:var(--glass);font-size:.68rem;font-family:var(--mono)}
.sb-list a.on{background:var(--card);color:var(--accent);font-weight:700}
.sb-list a.on b{background:var(--accent);color:var(--onaccent)}
.sb-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb-tools .btn{padding:7px 6px;font-size:.76rem}
.topnav{display:none;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:6px 10px}
.topnav a{display:inline-block;padding:6px 10px;font-size:.82rem;color:var(--ink2);text-decoration:none;border-radius:8px}
.layout{min-width:0;padding-block:16px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px}
.grade{display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 12px;border-radius:99px;background:var(--glass);font:600 .9rem var(--serif);box-shadow:var(--shadow)}
.grade svg{width:26px;height:26px;color:var(--ink)}
.topbar .sp{flex:1}
.langsw{display:inline-flex;border-radius:99px;overflow:hidden;background:var(--glass);box-shadow:var(--shadow);padding:3px}
.langsw button{background:transparent;color:var(--ink2);border:0;padding:5px 11px;font:700 .76rem var(--sans);cursor:pointer;border-radius:99px}
.langsw button.on{background:var(--accent);color:var(--onaccent)}
.toolbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border:0;border-radius:99px;background:var(--glass);color:var(--ink);font:600 .8rem var(--sans);box-shadow:var(--shadow);cursor:pointer;text-decoration:none}
.toolbtn.round{width:42px;padding:0;justify-content:center}
.sunsw{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 12px;border:0;border-radius:99px;background:var(--glass);box-shadow:var(--shadow);cursor:pointer;color:var(--gold)}
.sunsw .tr{position:relative;width:38px;height:22px;border-radius:99px;background:var(--bg2)}
.sunsw .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .2s}
[data-theme="dark"] .sunsw .tr::after{transform:translateX(16px)}
.prof{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--onaccent);text-decoration:none}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;min-height:236px;display:flex;align-items:center;background:linear-gradient(100deg,var(--peach) 8%,color-mix(in srgb,var(--peach) 45%,var(--bg2)) 46%,var(--bg2));box-shadow:var(--shadow)}
.hero canvas{position:absolute;right:0;top:0;width:60%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%);mask-image:linear-gradient(90deg,transparent 0,#000 16%)}
.htext{position:relative;z-index:1;padding:24px 28px;max-width:640px}
.hbadge{display:inline-block;padding:5px 16px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);font:600 .98rem var(--serif)}
.hero h1{font-size:clamp(1.6rem,3.1vw,2.62rem);line-height:1.14;margin:12px 0 10px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;font:500 1rem var(--serif);color:var(--ink2)}
.hero .star{position:absolute;color:var(--gold);z-index:1}
/* lens tabs */
.ltabs{display:flex;gap:10px;flex-wrap:wrap}
.ltabs button{display:inline-flex;align-items:center;gap:12px;padding:8px 26px 8px 18px;border:0;border-radius:99px;background:var(--glass);color:var(--ink);font:600 .95rem var(--serif);cursor:pointer;box-shadow:var(--shadow)}
.ltabs button svg{width:18px;height:30px}
.ltabs button.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--onaccent)}
/* lab */
.labgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;scroll-margin-top:12px}
.labgrid>*{min-width:0}
.stage{position:relative;border-radius:26px;background:linear-gradient(180deg,var(--card),var(--peach));box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.stage:fullscreen{border-radius:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;background:var(--bg)}
.stage.fake{position:fixed;inset:0;z-index:150;border-radius:0;overflow:auto}
.cvscroll{overflow-x:auto;overscroll-behavior-x:contain}
.cvwrap{position:relative;min-width:680px}
#cv{display:block;width:100%;height:auto;touch-action:pan-y;cursor:default;background:#c9d4ee}
#cv.grab{cursor:grab}#cv.drag{cursor:grabbing}
.ico{position:absolute;top:14px;width:46px;height:46px;border-radius:50%;border:0;background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);z-index:2}
.ico:hover{color:var(--accent)}
.ico.tl{left:14px}.ico.tr{right:14px}
.ico.on{background:var(--accent);color:var(--onaccent)}
.vseg{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:2;display:inline-flex;background:var(--glass);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.vseg button{border:0;background:none;padding:6px 16px;border-radius:99px;font:600 .82rem var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
.vseg button.on{background:var(--accent);color:var(--onaccent)}
.loupe{position:absolute;right:14px;top:72px;width:164px;padding:8px;border-radius:16px;background:var(--glass);box-shadow:var(--shadow);z-index:2;font-size:.74rem;font-weight:600}
.loupe canvas{display:block;width:100%;height:auto;border-radius:10px;background:#fff}
.loupe .mtr{height:7px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:3px}
.loupe .mtr i{display:block;height:100%;background:var(--exp);width:0;transition:width .15s}
.stbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 16px 2px;font-size:.84rem;color:var(--ink2);min-height:38px}
.stbar #stTxt{flex:1 1 280px;min-width:0}
.sttools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tgl{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:600 .76rem var(--sans);cursor:pointer}
.tgl.on{border-color:var(--accent);color:var(--accent);background:var(--cold-soft)}
.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(170px,1.05fr);gap:10px;padding:8px 14px 14px;align-items:stretch}
.mcard{display:grid;gap:2px;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(60,84,170,.08)}
.mcard .h{display:flex;align-items:center;gap:9px;font:600 .9rem var(--serif);min-width:0}
.mcard .h svg{flex:none;width:26px;height:26px;color:var(--accent)}
.mcard .h span{flex:1;min-width:0}
.mcard .h output{flex:none;font:700 .86rem var(--mono);color:var(--accent);white-space:nowrap}
input[type=range].rg{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:2px 0 0;cursor:pointer}
.rg::-webkit-slider-runnable-track{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--bg2) var(--p,50%))}
.rg::-moz-range-track{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--bg2) var(--p,50%))}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 2px 6px rgba(30,60,160,.35);margin-top:-7px}
.rg::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.obsbtn{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:20px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--onaccent);font:600 1.02rem var(--sans);cursor:pointer;box-shadow:0 8px 20px rgba(47,111,220,.3);min-height:60px;transition:transform .15s}
.obsbtn:hover{transform:translateY(-1px)}
.obsbtn svg{width:24px;height:24px}
/* worksheet */
.sheet{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:1120px;width:100%;margin-inline:auto;min-width:0}
.sheet>*{min-width:0}
section.card{margin:0;border-radius:var(--radius)}
.tblhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tomodel{white-space:nowrap}
.qfield{margin:10px 0}.qfield label{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
.qfield textarea{min-height:70px}
.inlineF{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;font-weight:600;font-size:.9rem}
.inlineF input{width:92px;font-family:var(--mono)}
td input{width:76px}td select{max-width:300px;width:auto}
td.ro{font-family:var(--mono);font-weight:600}
.tablewrap{background:var(--card)}
.seglab{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.seglab button{border:0;background:none;padding:5px 11px;border-radius:8px;font:600 .8rem var(--sans);color:var(--ink2);cursor:pointer}
.seglab button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
#chExp{touch-action:manipulation}
.hypline{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--mix-soft);font-size:.9rem}
.insimg{background:#fff}
/* settings dialog */
.setdlg{position:fixed;inset:0;z-index:160;display:grid;place-items:center;background:rgba(12,18,50,.45);padding:16px}
.setbox{width:min(440px,100%);background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:12px}
.setbox h2{margin:0;font-size:1.15rem}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;font-size:.9rem}
@media(max-width:1000px){.app{grid-template-columns:minmax(0,1fr)}.sb{display:none}.topnav{display:block}.layout{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media(max-width:780px){.mcards{grid-template-columns:minmax(0,1fr)}.hero canvas{width:100%;opacity:.2;-webkit-mask-image:none;mask-image:none}.cvwrap{min-width:0}.ico{top:6px;width:34px;height:34px}.ico.tl{left:6px}.ico.tr{right:6px}.ico svg{width:18px;height:18px}.vseg{top:6px}.vseg button{padding:3px 11px}.loupe{position:static;width:auto;display:grid;grid-template-columns:84px minmax(0,1fr);gap:0 10px;align-items:center;border-radius:0;box-shadow:none}.loupe canvas{grid-row:span 2}}
@media(max-width:520px){.toolbtn span{display:none}.toolbtn{padding:0;width:42px;justify-content:center}.prof{display:none}.topbar .sp{display:none}}
@media(max-height:760px){.sb-logo svg{width:44px;height:44px}.sb-logo b{font-size:1.2rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.sheetwrap{display:grid;gap:18px;min-width:0}
.labsec{display:grid;gap:14px;min-width:0;scroll-margin-top:12px}
.labsec .sh{margin:0}
.hgo{margin-top:14px}
.hero canvas{width:50%}
.htext{max-width:min(720px,54%)}
.hero p{font-size:.9rem;line-height:1.5}
@media(max-width:780px){.hero canvas{width:100%}.htext{max-width:none}}
.frac{font-family:var(--serif);font-style:italic;font-weight:600}
html .ftable td:first-child,html .f .e{font-family:var(--serif);font-style:italic;font-weight:600}
html .f .e .frac,html .ftable .frac{font-size:.95em}
html .frac>span{padding:0 .28em}
th .frac{font-size:.95em}
html .ftable td:first-child{font-size:1.12rem}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
td.bn select{max-width:170px;min-width:96px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:500 .84rem var(--sans)}
.autobox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:8px;box-shadow:var(--shadow);min-width:0}
.autobox tr.cur td{background:var(--cold-soft);font-weight:700}
.autobox td.ro{font-family:var(--mono)}
.amsg{flex:none;font-weight:700;font-size:.82rem;color:var(--exp)}.amsg.no{color:var(--warn)}.amsg:empty{display:none}
.stbar #stTxt{flex:1 1 100%}.amsg{margin-right:auto}
.mcard .h output{font-size:.8rem}
.ltabs{position:sticky;top:8px;z-index:14;width:fit-content;max-width:100%;padding:5px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ltabs button[data-mode=div].on{background:linear-gradient(180deg,color-mix(in srgb,var(--mix) 72%,#fff),var(--mix));color:var(--onaccent)}
.radios{margin-bottom:6px}
html.a11y-on .ltabs{top:calc(var(--a11yh,60px) + 6px)}
@media(max-width:1000px){.ltabs{top:50px;border-radius:22px}}
@media(max-width:520px){.ltabs{flex-wrap:nowrap;gap:4px;border-radius:99px}.ltabs button{padding:6px 11px 6px 9px;gap:6px;font-size:.76rem;white-space:nowrap}.ltabs button svg{width:12px;height:22px}}
@media(min-width:781px){.mcards.four{grid-template-columns:repeat(4,minmax(0,1fr))}.mcards.four .obsbtn{grid-column:1/-1;min-height:50px}}
@media(min-width:1360px){.mcards.four{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(160px,1fr)}.mcards.four .obsbtn{grid-column:auto}}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin:0 0 20px;box-shadow:var(--shadow);scroll-margin-top:70px}
@media(max-width:600px){section.card{padding:18px 16px}}
.sh{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.sh .no{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--mix));color:#fff;font-weight:800;flex:none}
.sh h2{margin:0;font-size:1.25rem;letter-spacing:-.01em}
h3{font-size:1rem;margin:18px 0 8px}p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:.86rem}
.lead{font-size:1.04rem;font-weight:600;border-left:4px solid var(--accent);padding:6px 0 6px 14px;margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--ink2)}
.chip.cold{background:var(--cold-soft);color:var(--cold)}.chip.mix{background:var(--mix-soft);color:var(--mix)}.chip.exp{background:var(--exp-soft);color:var(--exp)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.hot{background:var(--hot-soft);color:var(--hot)}
.crit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

qc4:['4. Соңғы тұжырым: жинағыш линзаның кескін құрылысы, F және D таңбасы туралы қандай қорытынды жасайсыз?','4. Итоговый вывод: какой вывод вы делаете о построении изображения в собирающей линзе и о знаках F и D?','4. Final conclusion: what do you conclude about image formation in a converging lens and the signs of F and D?'],
qd2:['2. d өзгергенде |f|, H және Γ қалай өзгерді? Қай мәндер мұны көрсетеді?','2. Как менялись |f|, H и Γ при изменении d? Какие значения это показывают?','2. How did |f|, H and Γ change as d changed? Which values show this?'],
qd3:['3. Гипотезаны растау: зерттеу басында ұсынылған екі гипотеза дәлелденді ме? Қай кестедегі қандай сандар оны растайды немесе терістейді?','3. Подтверждение гипотезы: подтвердились ли две гипотезы, выдвинутые в начале исследования? Какие числа в какой таблице это подтверждают или опровергают?','3. Testing the hypothesis: were the two hypotheses from the start of the investigation confirmed? Which numbers in which table support or contradict them?'],
qd4:['4. Соңғы тұжырым: шашыратқыш линзаның кескін құрылысы, F және D таңбасы туралы қандай қорытынды жасайсыз?','4. Итоговый вывод: какой вывод вы делаете о построении изображения в рассеивающей линзе и о знаках F и D?','4. Final conclusion: what do you conclude about image formation in a diverging lens and the signs of F and D?'],
physT:['Нақты кескін линзадан өткен сәулелердің өздері қиылысқан жерде пайда болады. Сондықтан оны экранға түсіріп, f қашықтығын сызғышпен тікелей өлшеуге болады.','Действительное изображение возникает там, где пересекаются сами лучи, прошедшие через линзу. Поэтому его можно получить на экране и прямо измерить f линейкой.','A real image forms where the rays that passed through the lens actually meet. That is why it can be caught on a screen and f can be measured directly with a ruler.'],
physTd:['Шашыратқыш линзадан кейін сәулелер таралады, тек олардың созындылары қиылысады. Мұндай кескінді экранға түсіруге болмайды, сондықтан f қашықтығын сызбадан анықтаймыз және теріс таңбамен жазамыз.','После рассеивающей линзы лучи расходятся, пересекаются только их продолжения. Такое изображение на экран не попадает, поэтому f определяют по схеме и записывают со знаком минус.','After a diverging lens the rays spread out and only their extensions meet. Such an image cannot be caught on a screen, so f is found from the diagram and written with a minus sign.'],

const SAFETY=[['Электр құралдарын тек құрғақ қолмен пайдаланыңыз. Зақымдалған сымдар мен құрылғыларды қолданбаңыз.','Пользуйтесь электроприборами только сухими руками. Не используйте повреждённые провода и устройства.','Use electrical equipment only with dry hands. Do not use damaged cables or devices.'],['Жанып тұрған шамның қызған бөліктеріне қол тигізбеңіз. Жарық көзіне тікелей ұзақ қарамаңыз.','Не прикасайтесь к горячим частям горящей лампы. Не смотрите долго прямо на источник света.','Do not touch the hot parts of a lit lamp. Do not look straight at the light source for a long time.'],['Жинағыш және шашыратқыш линзаларды абайлап ұстаңыз. Оларды құлатпаңыз және шыны бетіне саусақпен тимеңіз.','Обращайтесь с собирающей и рассеивающей линзами осторожно. Не роняйте их и не трогайте стекло пальцами.','Handle the converging and diverging lenses with care. Do not drop them or touch the glass with your fingers.'],['Линзаны, жарық көзін және басқа құралдарды орнықты орналастырыңыз. Олардың құлап кетуіне жол бермеңіз.','Устанавливайте линзу, источник света и другие приборы устойчиво. Не допускайте их падения.','Place the lens, light source and other equipment securely. Do not let them fall.'],['Тәжірибе аяқталған соң электр құралдарын өшіріңіз. Шам суығаннан кейін құралдарды жинап, жұмыс орнын ретке келтіріңіз.','После опыта выключите электроприборы. Когда лампа остынет, уберите приборы и приведите рабочее место в порядок.','After the experiment switch off the electrical equipment. When the lamp has cooled down, put the equipment away and tidy your workplace.']];

n front of the lens.'],['Сәулелердің өздері қиылыспайды, тек олардың созындылары қиылысады. Сондықтан кескін жалған болады, оны экранға түсіруге болмайды. Оны сәулелер сызбасынан табамыз: үзік сызықтардың қиылысуы кескіннің орнын көрсетеді.','Сами лучи не пересекаются, пересекаются только их продолжения. Поэтому изображение мнимое, на экран оно не попадает. Его находят на схеме лучей: пересечение штриховых линий показывает положение изображения.','The rays themselves do not meet, only their extensions do. So the image is virtual and cannot be caught on a screen. We find it on the ray diagram: the crossing of the dashed lines shows where the image is.'],['Формула жинағыш линзадағыдай, бірақ таңба ережесі бойынша фокус қашықтығы мен жалған кескінге дейінгі қашықтық теріс алынады: F < 0, f < 0. Модельде f пен H мәндерін сызғыштан анықтап, F пен D-ны есептейміз.','Формула та же, что и для собирающей линзы, но по правилу знаков фокусное расстояние и расстояние до мнимого изображения отрицательны: F < 0, f < 0. На модели мы определяем f и H по линейкам и вычисляем F и D.','The formula is the same as for a converging lens, but by the sign rule the focal length and the distance to the virtual image are negative: F < 0, f < 0. In the model we find f and H with the rulers and calculate F and D.']]).map(p=>`<p>${L(p)}</p>`).join('');

 add(L(D.n13),qs.map(id=>`<p><b>${document.querySelector(`label[for=${id}]`).innerHTML}</b><br>${es($(id).value)||bl}</p>`).join(''));
 add(L(D.n14),rs.map(id=>`<p><b>${L(D[id])}</b> ${es($(id).value)||bl}</p>`).join(''));
 const styles=[...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');
 const doc=`<!DOCTYPE html><html lang="${LANG}" data-theme="light"><head><meta charset="UTF-8"><title>${L(D.h1)}</title>${styles}<style>body{background:#fff;margin:0;padding:18px 26px;font-size:13px}.ph{border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:10px}.ph h1{font-size:18px;margin:0 0 4px;color:var(--accent)}.pblock{break-inside:avoid;margin:0 0 14px}.pblock h2{font-size:15px;margin:0 0 6px}.pv{font-family:var(--mono);font-weight:600}.tablewrap{overflow:visible}th,td{padding:4px 6px;font-size:12px;white-space:normal}@page{size:A4;margin:12mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body><div class="ph"><h1>${L(D.h1)}</h1><div>${L(D.k2)} · ${L(lensMode()==='conv'?D.tabConv:D.tabDiv)} · ${L(D.lname)}: <b>${es($('m-name').value)||'________________'}</b> · ${L(D.lclass)}: <b>${es($('m-class').value)||'______'}</b> · ${L(D.ldate)}: ${es($('m-date').value)||'______'}</div></div>${blocks.join('')}</body></html>`;
 let fr=$('printFrame');if(fr)fr.remove();fr=document.createElement('iframe');fr.id='printFrame';fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
 const d=fr.contentWindow.document;d.open();d.write(doc);d.close();setTimeout(()=>{fr.contentWindow.focus();fr.contentWindow.print()},400)}
$('printBtn').onclick=printReport;$('setPrint').onclick=printReport;

/* ================= FIELDS & SAVE ================= */
function collect(){const fields={};$$('[data-save]').forEach(el=>fields[el.id]=el.type==='checkbox'?el.checked:el.value);return{fields,T,NR,drawPts,lab:LAB.state(),ts:Date.now()}}
function persist(){store.set('fields',collect().fields)}
(function restore(){const f=(embedded&&embedded.fields)||store.get('fields',null);if(f)for(const k in f){const el=$(k);if(!el||f[k]==null)continue;if(el.type==='checkbox')el.checked=!!f[k];else el.value=f[k]}})();
$$('[data-save]').forEach(el=>el.addEventListener(el.type==='checkbox'?'change':'input',persist));
function saveHtml(){try{$('saved').textContent=JSON.stringify(collect()).replace(/</g,'\\u003c');const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('textarea').forEach(t=>{const o=$(t.id);if(o)t.textContent=o.value});clone.querySelectorAll('#printFrame,#setDlg[open]').forEach(x=>x.remove());
 const html='<!DOCTYPE html>\n'+clone.outerHTML,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));const g=($('m-name').value||'').trim().replace(/[^\wА-Яа-яӘәҒғҚқҢңӨөҰұҮүҺһІі-]+/g,'_');a.download='lab11_linza'+(g?'_'+g:'')+'.html';document.body.appendChild(a);a.click();a.remove();toast(L(['Толтырылған HTML файлы жүктелді','Заполненный HTML-файл скачан','Filled-in HTML file downloaded']))}catch(e){toast(L(['Сақтау мүмкін болмады','Не удалось сохранить','Could not save']))}}
$('saveHtml').onclick=saveHtml;$('setSaveB').onclick=saveHtml;

/* ================= SETTINGS, A11Y, LANG ================= */
const setD=$('setDlg');$('setOpen').onclick=()=>{setD.hidden=false;$('resetAsk').hidden=true;$('setClose').focus()};$('setClose').onclick=()=>setD.hidden=true;setD.addEventListener('click',e=>{if(e.target===setD)setD.hidden=true});addEventListener('keydown',e=>{if(e.key==='Escape')setD.hidden=true});
$('setResetB').onclick=()=>$('resetAsk').hidden=false;$('resetNo').onclick=()=>$('resetAsk').hidden=true;
$('resetYes').onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('lab11_')).forEach(k=>localStorage.removeItem(k))}catch(e){}$('saved').textContent='{}';location.reload()};
const flipTheme=()=>{theme=theme==='dark'?'light':'dark';store.set('theme',theme);document.documentElement.setAttribute('data-theme',theme);LAB.redrawTheme();renderExplorer()};
$('themeBtn').onclick=flipTheme;$('setTheme').onclick=flipTheme;
const A_DEF={on:false,fs:0,cs:0,ff:0,ls:0,lh:0};let A=Object.assign({},A_DEF,store.get('a11y',{}));
function applyA(){const h=document.documentElement;[...h.classList].filter(c=>/^(a11y-on|(fs|cs|ff|ls|lh)-\d)$/.test(c)).forEach(c=>h.classList.remove(c));$('a11yBar').hidden=!A.on;if(A.on){h.classList.add('a11y-on','fs-'+A.fs,'cs-'+A.cs,'ff-'+A.ff,'ls-'+A.ls,'lh-'+A.lh);h.style.setProperty('--a11yh',$('a11yBar').offsetHeight+'px')}else $('a11yPanel').hidden=true;['fs','cs','ff','ls','lh'].forEach(k=>$$(`#a11yBar [data-${k}]`).forEach(b=>b.classList.toggle('on',+b.dataset[k]===A[k])));store.set('a11y',A);LAB.draw()}
const setA=(k,v)=>{A[k]=v;applyA()};
$('a11yOn').onclick=()=>setA('on',true);$('setA11y').onclick=()=>{setD.hidden=true;setA('on',true)};$('a11yOff').onclick=()=>setA('on',false);
$('a11ySet').onclick=()=>{$('a11yPanel').hidden=!$('a11yPanel').hidden;applyA()};$('a11yClose').onclick=()=>{$('a11yPanel').hidden=true;applyA()};
$('a11yReset').onclick=()=>{A=Object.assign({},A_DEF,{on:true});applyA()};
['fs','cs','ff','ls','lh'].forEach(k=>$$(`#a11yBar [data-${k}]`).forEach(b=>b.onclick=()=>setA(k,+b.dataset[k])));
addEventListener('resize',()=>{if(A.on)applyA()});
function setLang(l){LANG=l;store.set('lang',l);document.documentElement.lang=l;document.title=L(['Жұқа линза · №11 зертхана','Тонкая линза · Лаборатория №11','Thin lens · Lab 11']);$$('.langsw button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));applyT();$('autoMsg').textContent='';applyMode();renderRuler();LAB.ui();LAB.hero()}
$$('.langsw button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
if(embedded&&embedded.lab)LAB.load(embedded.lab);
if(embedded){store.set('T',T);store.set('nr',NR);store.set('drawPts',drawPts);persist()}
document.documentElement.setAttribute('data-theme',theme);
setLang(LANG);applyA();LAB.hero();LAB.run();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{LAB.draw();LAB.hero()});
})();
</script>
